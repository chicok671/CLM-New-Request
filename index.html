<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Contract Request Decision Tree</title>
  <style>
    :root {
      --bg: #f3f5f4;
      --panel: #ffffff;
      --ink: #1b2a2f;
      --muted: #5b6b70;
      --line: #d6dedc;
      --soft: #e8eeec;
      --accent: #17616b;
      --accent-ink: #ffffff;
      --accent-soft: #dcecec;
      --ok: #2f7a45;
      --ok-soft: #e1f0e5;
      --flag: #9a6a00;
      --flag-soft: #f8eed4;
      --stop: #b2362b;
      --stop-soft: #f8e3e0;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    header { margin-bottom: 18px; }
    .eyebrow {
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 38px);
      line-height: 1.15;
      font-family: Georgia, "Times New Roman", serif;
    }
    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 60ch;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
    }
    .rail {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      list-style: none;
      padding: 0;
      margin: 0 0 18px;
    }
    .rail li {
      border-top: 3px solid var(--line);
      padding-top: 8px;
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }
    .rail li strong {
      display: block;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2px;
      font-family: "IBM Plex Mono", Consolas, monospace;
    }
    .rail li.active { border-color: var(--accent); color: var(--ink); font-weight: 600; }
    .rail li.done { border-color: var(--accent); color: var(--ink); }

    .question {
      margin: 0 0 18px;
      font-size: clamp(22px, 2.5vw, 30px);
      line-height: 1.3;
      font-family: Georgia, "Times New Roman", serif;
      max-width: 38ch;
    }
    .answers {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }
    .ans {
      flex: 1 1 220px;
      min-height: 72px;
      text-align: left;
      background: var(--panel);
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      font: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .ans:hover { border-color: var(--accent); background: var(--accent-soft); }
    .ans strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .ans span { color: var(--muted); font-size: 13px; }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font: 500 14px/1.2 "IBM Plex Sans", sans-serif;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .guide {
      margin-top: 18px;
      background: var(--soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      color: var(--ink);
      max-width: 70ch;
      font-size: 14px;
    }
    .guide strong { display:block; margin-bottom:2px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; font-size:11px; }

    .result { display: none; margin-top: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 24px; }
    .result.visible { display: block; }
    .result h2 { margin: 0 0 8px; font-size: clamp(24px, 2vw, 32px); font-family: Georgia, "Times New Roman", serif; }
    .result p { margin: 0 0 16px; color: var(--muted); }
    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; font-size: 14px; margin-top: 6px; }
    .meta div span { display:block; color:var(--muted); margin-bottom:4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }

    .warning { color: var(--stop); background: var(--stop-soft); border: 1px solid #efc1bc; padding: 10px 12px; border-radius:8px; margin-top:14px; font-size:14px; }
    .ok { color: var(--ok); background: var(--ok-soft); border: 1px solid #cfe5d2; padding:10px 12px; border-radius:8px; margin-top:14px; font-size:14px; }

    @media (max-width: 640px) {
      .card { padding: 20px; }
      .answers { display: grid; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">JFF Contracts · Intake</div>
      <h1>Contract Request Decision Tree</h1>
      <p class="sub">Answer a few Yes/No questions to find the right contract pathway, then fill out the information needed for intake.</p>
    </header>

    <ol class="rail" id="rail"></ol>

    <div class="card" id="app">
      <div id="stage"></div>
      <div class="nav">
        <div class="btn-row">
          <button class="btn" id="backBtn" type="button">Back</button>
          <button class="btn" id="restartBtn" type="button">Restart</button>
        </div>
      </div>
    </div>

    <section class="result" id="result"></section>
  </div>

  <script>
    const phases = [
      { key: 'classify', label: 'Classify' },
      { key: 'existing', label: 'Existing agreement' },
      { key: 'paper', label: 'Draft or review' },
      { key: 'required', label: 'Request details' },
      { key: 'payee', label: 'Payee readiness' },
      { key: 'final', label: 'Final check' },
      { key: 'done', label: 'Done' }
    ];

    const questions = {
      q1: {
        text: 'Is JFF receiving money, services, sponsorship, donations, or other consideration from another party?',
        yes: { outcome: 'award', next: 'done' },
        no: { next: 'q2' }
      },
      q2: {
        text: 'Is JFF paying money or providing funding to another party?',
        yes: { next: 'q3' },
        no: { next: 'q10' }
      },
      q3: {
        text: 'Is the payment for services, products, deliverables, or other work performed for JFF?',
        yes: { next: 'q4' },
        no: { next: 'q6' }
      },
      q4: {
        text: 'Is the total payment $25,000 or less, paid in one payment after completion, with no changes to JFF’s standard invoice terms?',
        yes: { outcome: 'invoice', next: 'done' },
        no: { next: 'q5' }
      },
      q5: {
        text: 'Is the payment a one-time, token payment (typically under $5,000) with no substantive deliverable or performance expectation?',
        yes: { outcome: 'honorarium', next: 'done' },
        no: { next: 'q7' }
      },
      q6: {
        text: 'Is JFF providing incentive funding to a subrecipient under an approved no-agreement incentive-funding pathway?',
        yes: { outcome: 'incentive', next: 'done' },
        no: { next: 'q7' }
      },
      q7: {
        text: 'Is the payee expected to provide services, products, deliverables, or labor to JFF?',
        yes: { outcome: 'psa', next: 'done' },
        no: { next: 'q8' }
      },
      q8: {
        text: 'Is the payee expected to make independent programmatic decisions or perform activities integral to the project, such as program design, delivery, or evaluation?',
        yes: { outcome: 'subaward', next: 'done' },
        no: { outcome: 'subaward', next: 'done' }
      },
      q10: {
        text: 'Is JFF collaborating with another party without money being paid by either party?',
        yes: { next: 'q11' },
        no: { next: 'q13' }
      },
      q11: {
        text: 'Is the collaboration nonbinding and focused on shared goals, intent, or joint activities?',
        yes: { outcome: 'mou', next: 'done' },
        no: { next: 'q12' }
      },
      q12: {
        text: 'Are JFF and the other party jointly pursuing a grant, contract, bid, or other funding opportunity?',
        yes: { outcome: 'teaming', next: 'done' },
        no: { outcome: 'mou', next: 'done' }
      },
      q13: {
        text: 'Will JFF share or receive proprietary, confidential, strategic, or business information?',
        yes: { next: 'q14' },
        no: { next: 'q15' }
      },
      q14: {
        text: 'Will the arrangement involve project data, learner data, worker data, demographic data, or other personal information?',
        yes: { outcome: 'dsa', next: 'done' },
        no: { outcome: 'nda', next: 'done' }
      },
      q15: {
        text: 'Is the request for another legal instrument, such as an assignment, amendment, termination, waiver, letter of commitment, quitclaim, or other document?',
        yes: { outcome: 'misc', next: 'done' },
        no: { outcome: 'review', next: 'done' }
      }
    };

    const outcomes = {
      award: 'Award Agreement / Award Review',
      psa: 'Professional Services Agreement',
      subaward: 'Pass-Through / Subaward Agreement',
      honorarium: 'Honorarium / Stipend',
      invoice: 'No-Agreement Invoice Pathway',
      incentive: 'Incentive Funding / PILOT Pathway',
      nda: 'NDA / Confidentiality Agreement',
      dsa: 'Data Sharing / Data Use Agreement',
      mou: 'MOU / Partnership Agreement',
      teaming: 'Teaming Agreement',
      misc: 'Miscellaneous Legal Instrument',
      review: 'Contracts Team Review'
    };

    const state = { current: 'q1', history: [], values: {}, result: null };

    const rail = document.getElementById('rail');
    const stage = document.getElementById('stage');
    const backBtn = document.getElementById('backBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultBox = document.getElementById('result');

    function renderRail() {
      rail.innerHTML = '';
      phases.forEach((phase, index) => {
        const li = document.createElement('li');
        const strong = document.createElement('strong');
        strong.textContent = 'Step ' + (index + 1);
        li.appendChild(strong);
        li.appendChild(document.createTextNode(phase.label));
        if (phase.key === 'done') li.classList.add('done');
        if (phase.key === 'classify' && !state.result) li.classList.add('active');
        rail.appendChild(li);
      });
    }

    function renderQuestion() {
      const q = questions[state.current];
      if (!q) { renderResult(); return; }

      const qWrap = document.createElement('div');
      qWrap.innerHTML = `
        <div class="question">${q.text}</div>
        <div class="answers">
          <button class="ans" data-answer="yes" type="button">
            <strong>Yes</strong>
            <span>Proceed with this path.</span>
          </button>
          <button class="ans" data-answer="no" type="button">
            <strong>No</strong>
            <span>Go to the alternative path.</span>
          </button>
        </div>
        <div class="guide">
          <strong>Guidance</strong>
          This quick intake helps route the request to the correct contract pathway before more detail is collected.
        </div>
      `;

      stage.innerHTML = '';
      stage.appendChild(qWrap);

      qWrap.querySelectorAll('.ans').forEach(btn => {
        btn.addEventListener('click', () => {
          const answer = btn.dataset.answer;
          state.history.push(state.current);
          state.values[state.current] = answer;

          const next = q[answer];
          if (next && next.outcome) {
            state.result = next.outcome;
            renderResult();
            return;
          }

          if (next && next.next) {
            state.current = next.next;
            renderRail();
            renderQuestion();
          } else {
            state.result = 'review';
            renderResult();
          }
        });
      });

      backBtn.disabled = state.history.length === 0;
      resultBox.classList.remove('visible');
    }

    function renderResult() {
      const outcome = state.result || 'review';
      const label = outcomes[outcome] || 'Contracts Team Review';
      const isStop = ['review', 'misc'].includes(outcome);

      resultBox.innerHTML = `
        <h2>Recommended pathway</h2>
        <p>The intake points to the following pathway for this request.</p>
        <div class="meta">
          <div><span>Pathway</span><strong>${label}</strong></div>
          <div><span>Current step</span><strong>${state.current}</strong></div>
          <div><span>Last answer</span><strong>${state.values[state.current] || 'N/A'}</strong></div>
        </div>
        ${isStop ? '<div class="warning">This request should be routed to the Contracts Team for review or a follow-up clarification.</div>' : '<div class="ok">This request appears to fit the normal contract intake path and can move forward with document details.</div>'}
      `;
      resultBox.classList.add('visible');
      stage.innerHTML = '';
      renderRail();
    }

    function goBack() {
      if (!state.history.length) return;
      const previous = state.history.pop();
      state.current = previous;
      state.result = null;
      delete state.values[previous];
      renderRail();
      renderQuestion();
    }

    function restart() {
      state.current = 'q1';
      state.history = [];
      state.values = {};
      state.result = null;
      renderRail();
      renderQuestion();
    }

    backBtn.addEventListener('click', goBack);
    restartBtn.addEventListener('click', restart);

    renderRail();
    renderQuestion();
  </script>
</body>
</html>
